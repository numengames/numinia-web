#
# Workflow lint (STD-015 SEC-007/SEC-008): the workflows are code that runs
# with a token, so they get read like code.
#
#   · actionlint — syntax, expressions, shellcheck over every `run:` block.
#     The release binary, verified against its published checksums.
#   · zizmor — security audit: template injection, credential persistence,
#     over-broad permissions, unpinned actions. Pinned release from PyPI.
#
# Seen, not enforced: both steps report in the log and the job summary and
# the job stays green (continue-on-error), like the dependency audit in
# ci.yml. Not part of the required `build` check. Turning it into a gate
# comes after the pre-existing findings are cleared.
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + zizmor (reports, does not block)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ZIZMOR_VERSION: 1.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install actionlint (checksum verified)
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o actionlint-checksums.txt "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $tarball\$" actionlint-checksums.txt | sha256sum -c -
          tar xzf "$tarball" actionlint
          ./actionlint -version

      - name: actionlint
        id: actionlint
        continue-on-error: true
        run: ./actionlint -color

      - name: Install zizmor
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: zizmor
        id: zizmor
        continue-on-error: true
        run: zizmor --format plain .github/workflows

      - name: Summary
        if: always()
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          {
            echo "### Workflow lint — seen, not enforced"
            echo
            echo "- actionlint: \`${ACTIONLINT_OUTCOME}\`"
            echo "- zizmor: \`${ZIZMOR_OUTCOME}\`"
            echo
            echo "A failure here does not block the merge; read the step log for the findings."
          } >> "$GITHUB_STEP_SUMMARY"
