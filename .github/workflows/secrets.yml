#
# The full-history secret scan (STD-015 SEC-004, STD-022 KEY-054). The job
# lives once, in numengames/.github; this file only says when it runs. To
# allow a false positive, add it to this repository's .gitleaks.toml.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    uses: numengames/.github/.github/workflows/secrets.yml@05ab0e22ef8be7ea886bdf0933789a82c1dcd5b0
    permissions:
      contents: read
