#
# The full-history secret scan (STD-015 SEC-004, STD-022 KEY-054). The job
# lives once, in numengames/.github; this file only says when it runs. To
# allow a false positive, add it to this repository's .gitleaks.toml.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    uses: numengames/.github/.github/workflows/secrets.yml@3d2cca44cebc8ef7420f1bee3451d7227d55d8ce
    permissions:
      contents: read
