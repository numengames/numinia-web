#
# Code scanning (STD-015): CodeQL reads the JavaScript and TypeScript of
# every workspace for injection, unsafe redirects, prototype pollution and
# the rest of its default query suite. `build-mode: none` — CodeQL parses
# the sources directly, nothing is built and no secret is read.
#
# Seen, not enforced: a separate workflow, not part of the required `build`
# check. Findings land in the Security tab (code scanning alerts); triage
# them there. Promoting this to a required check is a ruleset decision,
# taken in numinia-archive, not an edit here.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
