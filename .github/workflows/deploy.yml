# Deploy numinia.com — the platform ships from the `numinia-web` Worker
# (one-Worker policy: name matches this repo).
#
# Two triggers (Oracle decision 2026-08-15, night):
#   1. AUTO — every CI run that finishes green on main deploys that exact SHA.
#   2. MANUAL — workflow_dispatch as the emergency lever; it refuses commits
#      whose CI is not green unless `force` is explicitly checked.
#
# The guard job decides IF this run ships (green CI, not superseded by a
# newer main); the deploy job does the shipping and then PROVES it: the build
# is stamped with its commit SHA (/version.json) and the smoke test asserts
# the live site serves exactly that SHA.
#
# Runtime secrets live on the Worker itself (`wrangler secret put`), never here.
# Repo secrets used: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (inherited
# from the pre-platform repo; rotation scheduled — see docs/status.md NEXT #2).
# Repo variable required: PUBLIC_THIRDWEB_CLIENT_ID (public by design).
#
# Rollback: Actions → "Rollback numinia.com" (experimental) or Cloudflare
# dashboard → Workers → numinia-web → Deployments → Rollback (instant).
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if this commit's CI is not green (emergencies only)"
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Should this ship?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ship: ${{ steps.decide.outputs.ship }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # Auto path: skip quietly if main moved on — the newer commit's own
          # green CI will ship it. Prevents an old rerun overwriting new code.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tip=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
            if [ "$tip" != "$sha" ]; then
              echo "::notice::main is at $tip; $sha is superseded — not shipping (the newer CI will)."
              echo "ship=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual path: require green CI on the commit unless force.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "::warning::FORCE deploy of $sha — CI checks bypassed by the Oracle."
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate)
          bad=$(echo "$json" | jq '[.check_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
          pending=$(echo "$json" | jq '[.check_runs[] | select(.status != "completed")] | length')
          total=$(echo "$json" | jq '.check_runs | length')
          echo "check-runs: $total total, $pending pending, $bad not green"
          if [ "$total" -eq 0 ]; then echo "::error::No CI results for this commit — let CI run, or use force."; exit 1; fi
          if [ "$pending" -gt 0 ]; then echo "::error::CI is still running — wait for green, or use force."; exit 1; fi
          if [ "$bad" -gt 0 ]; then echo "::error::CI is red on this commit — fix it, or use force if you truly must."; exit 1; fi
          echo "ship=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & deploy numinia-web
    needs: guard
    if: needs.guard.outputs.ship == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (the exact SHA the guard approved)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - name: Gate — the login cannot ship blind
        env:
          CLIENT_ID: ${{ vars.PUBLIC_THIRDWEB_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Repo variable PUBLIC_THIRDWEB_CLIENT_ID is empty — the login would ship broken. Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: Build for Cloudflare (real catalog — a deploy must not ship fixtures)
        # Through turbo so workspace packages (domain, ui, analytics) build
        # first — their exports point at dist/, absent on a fresh runner.
        run: npx turbo run build --filter=@numinia/store
        env:
          DEPLOY_TARGET: cloudflare
          PUBLIC_SITE_URL: https://numinia.com
          GITHUB_REPO_OWNER: PabloFMM
          GITHUB_REPO_NAME: numinia-digital-goods-data
          PUBLIC_THIRDWEB_CLIENT_ID: ${{ vars.PUBLIC_THIRDWEB_CLIENT_ID }}
      - name: Stamp the build with its own identity (/version.json)
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "${{ needs.guard.outputs.sha }}" "$(date -u +%FT%TZ)" \
            > apps/store/dist/client/version.json
          cat apps/store/dist/client/version.json
      - name: Deploy Worker (numinia-web, custom domains numinia.com + www)
        run: npx wrangler deploy -c wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test — the live city answers AND is this exact commit
        run: |
          set -e
          sha="${{ needs.guard.outputs.sha }}"
          # The edge needs a few seconds to serve the new version everywhere.
          live=""
          for i in $(seq 1 12); do
            live=$(curl -s --max-time 20 https://numinia.com/version.json | jq -r '.commit // empty' 2>/dev/null || true)
            [ "$live" = "$sha" ] && break
            echo "attempt $i: live=$live (want $sha) — retrying in 5s"
            sleep 5
          done
          if [ "$live" != "$sha" ]; then
            echo "::error::Live site serves '$live', expected '$sha' — the deploy did not take."
            exit 1
          fi
          echo "version match: $live"
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://numinia.com$1")
            echo "GET $1 -> $code (expected $2)"
            [ "$code" = "$2" ]
          }
          check /        200
          check /city/   200
          check /lap/    200
          check /es/     200
          # 401 (not 503) proves the Worker secrets are loaded and auth fails closed.
          check /api/auth/session 401
      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## numinia.com deploy — ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ needs.guard.outputs.sha }}\`"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Live: https://numinia.com · verify: https://numinia.com/version.json"
            echo "- Rollback: Actions → \"Rollback numinia.com\", or Cloudflare dashboard → Workers → numinia-web → Deployments"
          } >> "$GITHUB_STEP_SUMMARY"
