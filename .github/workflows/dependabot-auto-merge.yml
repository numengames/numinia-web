#
# Dependabot pull requests merge themselves once every required check is
# green (Oracle rule, 2026-09-18). The job lives once, in numengames/.github;
# only it gets write, and only the two scopes it needs.
name: Dependabot auto-merge

on: pull_request

permissions: read-all

jobs:
  auto-merge:
    uses: numengames/.github/.github/workflows/dependabot-auto-merge.yml@3d2cca44cebc8ef7420f1bee3451d7227d55d8ce
    permissions:
      contents: write
      pull-requests: write
