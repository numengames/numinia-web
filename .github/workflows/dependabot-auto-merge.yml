# Dependabot pull requests merge themselves once CI is green.
#
# Oracle rule (2026-09-18): every dependency at its latest version, no
# pinning to old releases. This workflow approves the PR (the ruleset asks
# for one review) and enables GitHub's auto-merge, so the merge happens
# only when every required check has passed. A red check leaves the PR
# open for a human. Requires "Allow auto-merge" in the repository
# settings (operator act); without it the merge step fails and nothing
# else happens.
name: Dependabot auto-merge
on: pull_request

# Least privilege (OpenSSF Scorecard, Token-Permissions): the workflow
# token is read-only; only the job that approves and merges may write.
permissions: read-all

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (squash) — merges when the required checks pass
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
