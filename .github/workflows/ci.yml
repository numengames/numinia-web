name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_REPO_OWNER: PabloFMM
  GITHUB_REPO_NAME: numinia-digital-goods-data

jobs:
  quality:
    name: Pipeline + acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Install (reproducible)
        run: npm ci
      # A change to the site must say what it changed: any diff under
      # apps/store/src/ needs a new entry (and version) in
      # apps/store/src/lib/updates.ts. The footer prints that version.
      - name: Version bump (the footer's number moves with the site)
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref || 'main' }}"
          node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref || 'main' }}"
      - name: Pipeline (type-check → lint → test → build)
        run: npm run ci
        env:
          # Hermetic: the committed fixture keeps CI independent of raw.githubusercontent
          DATA_SOURCE: fixture
      - name: REUSE 3.3 (every file declares its license — canon C-005)
        # Armed 2026-08-18, the day the repo first passed. Pinned version.
        run: |
          pipx install reuse==6.2.0
          reuse lint
      - name: Acceptance (Gherkin)
        run: npm run test:acceptance
      - name: License guard
        run: npm run licenses:guard
      - name: Coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: warn

  e2e:
    name: DECISION GATE e2e (VRM island)
    runs-on: ubuntu-latest
    # A hung apt mirror once ate 20+ minutes of private-repo quota. Die loudly.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: Playwright version (cache key)
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/store
      - name: Cache browsers (~400MB download skipped on hit)
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install browsers (chromium + firefox + webkit — the CI config enables all three)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/store
      - name: Install system deps only (browsers cached; OS packages are not)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
        working-directory: apps/store
      - name: Build store (hermetic catalog)
        # Through turbo so workspace packages build first (dist/ exports).
        run: npx turbo run build --filter=@numinia/store
        env:
          DATA_SOURCE: fixture
          # A placeholder, never a real key: the login island refuses to mount
          # without one, and the legal gate (MIS-086) must be testable. Nothing
          # here can connect to a wallet — the gate spec never gets that far.
          PUBLIC_THIRDWEB_CLIENT_ID: e2e-placeholder-client-id
      - name: Bake the export editions (PDF + EPUB, fixture corpus — MIS-085 C)
        run: npm run exports:codex
        env:
          DATA_SOURCE: fixture
      - name: epubcheck (the EPUB must be a valid book, not just a zip)
        run: |
          curl -sSfL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.1.0/epubcheck.jar apps/store/dist/client/descargas/*.epub
      - name: VRM rendering gate
        run: npm run e2e

  # Two gates, split because they answer to different clocks.
  #
  # The license gate is deterministic: same tree, same verdict, forever. It blocks.
  #
  # The audit is not. `npm audit` queries a live advisory database, so the same
  # lockfile flips from pass to fail with no commit in between — which is exactly
  # what happened here: 1014349 passed on 2026-08-18 and failed on 2026-09-11 with
  # the lockfile untouched since 2026-08-17. A blocking gate that decays on its own
  # stops measuring the change under review and starts measuring the calendar. The
  # first person to hit it blames their own diff; the second one deletes the gate.
  #
  # So the audit reports and does not block. Nothing is hidden: the step still runs
  # on every PR and its findings are in the log, and the night watch (monitor.yml)
  # carries the standing debt. Deciding to ship with known advisories is a call for
  # a human, taken once, out loud — not a wall a docs PR walks into by surprise.

  licenses:
    name: License gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: License gate (block strong copyleft; LGPL reviewed exception — sharp/libvips)
        run: npm run licenses:check

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: Audit production dependencies (reports, does not block)
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            echo "No production advisory at or above **high**." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Production advisories at or above \`high\`"
              echo
              echo "Advisory state, not a verdict on this pull request: the database moves"
              echo "on its own. Read the audit step for the list."
              echo
              echo "Fixing them means upgrading dependencies, which is its own change."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The single required check, named `build` in every Numen repository.
  #
  # Branch protection is written once, in numinia-nwos
  # (.github/rulesets/protect-main.json), and copied verbatim to each repo. A
  # ruleset can only require a check by NAME, so the name has to mean the same
  # thing everywhere — otherwise the rule looks identical and protects
  # different things. It named `build`, a job that existed only in the archive,
  # and here it waited forever for a check that was never coming: seven green
  # checks, an approved review, and a pull request blocked on nothing.
  #
  # This repo does not have one gate, it has three. So `build` is not a fourth
  # piece of work — it is their conjunction, and it cannot pass unless all of
  # them do. Adding a gate here means adding it to `needs`, or the ruleset
  # keeps protecting yesterday's list.
  #
  # The audit is deliberately absent: it reports, it does not block.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [quality, e2e, licenses]
    if: always()
    steps:
      - name: Every blocking gate passed
        run: |
          set -euo pipefail
          failed=0
          for gate in "quality:${{ needs.quality.result }}" \
                      "e2e:${{ needs.e2e.result }}" \
                      "licenses:${{ needs.licenses.result }}"; do
            name="${gate%%:*}"; result="${gate#*:}"
            printf '%-10s %s\n' "$name" "$result"
            [ "$result" = "success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::a blocking gate did not pass"
            exit 1
          fi
          echo "All blocking gates passed."
