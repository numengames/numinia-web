name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_REPO_OWNER: PabloFMM
  GITHUB_REPO_NAME: numinia-digital-goods-data

jobs:
  quality:
    name: Pipeline + acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Install (reproducible)
        run: npm ci
      - name: Pipeline (type-check → lint → test → build)
        run: npm run ci
        env:
          # Hermetic: the committed fixture keeps CI independent of raw.githubusercontent
          DATA_SOURCE: fixture
      - name: REUSE 3.3 (every file declares its license — canon C-005)
        # Armed 2026-08-18, the day the repo first passed. Pinned version.
        run: |
          pipx install reuse==6.2.0
          reuse lint
      - name: Acceptance (Gherkin)
        run: npm run test:acceptance
      - name: License guard (DEBT-001 — no ConsenSys code in dist/)
        run: npm run licenses:guard
      - name: Coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: warn

  e2e:
    name: DECISION GATE e2e (VRM island)
    runs-on: ubuntu-latest
    # A hung apt mirror once ate 20+ minutes of private-repo quota. Die loudly.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: Playwright version (cache key)
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/store
      - name: Cache browsers (~400MB download skipped on hit)
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install browsers (chromium + firefox + webkit — the CI config enables all three)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/store
      - name: Install system deps only (browsers cached; OS packages are not)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
        working-directory: apps/store
      - name: Build store (hermetic catalog)
        # Through turbo so workspace packages build first (dist/ exports).
        run: npx turbo run build --filter=@numinia/store
        env:
          DATA_SOURCE: fixture
      - name: Bake the export editions (PDF + EPUB, fixture corpus — MIS-085 C)
        run: npm run exports:codex
        env:
          DATA_SOURCE: fixture
      - name: epubcheck (the EPUB must be a valid book, not just a zip)
        run: |
          curl -sSfL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.1.0/epubcheck.jar apps/store/dist/client/descargas/*.epub
      - name: VRM rendering gate
        run: npm run e2e

  supply-chain:
    name: Audit + licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: License gate (block strong copyleft; LGPL reviewed exception — sharp/libvips)
        run: npm run licenses:check
