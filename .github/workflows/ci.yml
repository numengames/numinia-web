name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_REPO_OWNER: PabloFMM
  GITHUB_REPO_NAME: numinia-digital-goods-data

jobs:
  quality:
    name: Pipeline + acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Install (reproducible)
        run: npm ci
      - name: Pipeline (type-check → lint → test → build)
        run: npm run ci
        env:
          # Hermetic: the committed fixture keeps CI independent of raw.githubusercontent
          DATA_SOURCE: fixture
      - name: Acceptance (Gherkin)
        run: npm run test:acceptance
      - name: Coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: warn

  e2e:
    name: DECISION GATE e2e (VRM island)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/store
      - name: Build store (hermetic catalog)
        run: npm --workspace @numinia/store run build
        env:
          DATA_SOURCE: fixture
      - name: VRM rendering gate
        run: npm run e2e

  supply-chain:
    name: Audit + licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (reproducible)
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: License gate (block strong copyleft; LGPL reviewed exception — sharp/libvips)
        run: npm run licenses:check
