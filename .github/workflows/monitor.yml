#
# Night watch for numinia.com: a probe of the live site on a schedule. On failure
# it opens a `night-watch` issue here; on recovery it closes it. The job lives
# once, in numengames/.github; this file says when and what to probe.
name: Night watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: night-watch
  cancel-in-progress: false

jobs:
  probe:
    uses: numengames/.github/.github/workflows/monitor.yml@c87e85e17306324752a59426f899e48059d42609
    permissions:
      issues: write
    with:
      site: numinia.com
      follow-redirects: false
      version-path: /version.json
      checks: |
        / 200
        /es/ 200
        /city/ 200
        /lap/ 200
        /api/auth/session 401
