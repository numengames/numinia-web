# Dependabot: keep every dependency at its latest version.
# Oracle rule (2026-09-18): nothing stays pinned to an old release; the
# checks decide, not a person. `dependabot-auto-merge.yml` approves and
# merges each update once CI is green.
# Grouping (2026-10-27): each ecosystem sends ONE pull request with all its minor and
# patch updates (group `minor-and-patch`), and every major update comes alone, so a
# major that breaks the build holds back only itself, not the safe updates. Dependabot
# cannot group across ecosystems, so npm / github-actions each still open their own.
# (Before, 2026-10-20: one group `all-dependencies` with majors inside.)
# Playwright group (2026-10-29): see the comment on the npm group.
# Cooldown (2026-10-15): a version is proposed only after it has been public
# for 7 days, so a hijacked or broken release is usually flagged by others
# before it reaches this repository. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      # Playwright and its axe wrapper move together and apart from the rest: a new Playwright
      # needs the visual-baselines image changed and the screenshots redrawn, and a new axe-core
      # can add accessibility rules. Listed first, so these names never fall into minor-and-patch.
      playwright:
        patterns: ["playwright", "playwright-core", "@playwright/*", "@axe-core/playwright"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # astro check and typescript-eslint do not support TypeScript 7 yet;
      # remove when they do.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
