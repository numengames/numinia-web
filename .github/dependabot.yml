# Dependabot: keep every dependency at its latest version.
# Oracle rule (2026-09-18): nothing stays pinned to an old release; the
# checks decide, not a person. `dependabot-auto-merge.yml` approves and
# merges each update once CI is green.
# Grouping (2026-10-20): each ecosystem sends ONE pull request with all its updates
# (group `all-dependencies`), so there is never a pile of separate ones. Dependabot cannot
# group across ecosystems, so npm / github-actions / pip each still open their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns: ["*"]
    ignore:
      # astro check and typescript-eslint do not support TypeScript 7 yet;
      # remove when they do.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "ci(deps)"
    groups:
      all-dependencies:
        patterns: ["*"]
